name: Actualizeaza feed Instagram

on:
  schedule:
    # ruleaza la fiecare 3 ore
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # permite si rulare manuala din GitHub, la nevoie

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruleaza scriptul de actualizare
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python fetch_instagram.py

      - name: Salveaza fisierul actualizat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizare automata feed Instagram"
          git push
